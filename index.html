<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>営業日計算</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>営業日カウンター</h1>
        <div class="field">
            <label for="baseDate">基準日</label>
            <input type="date" id="baseDate">
        </div>

        <div class="field">
            <label for="businessDays">営業日数</label>
            <input type="number" id="businessDays" min="1">
        </div>

        <div class="field">
            <input type="radio" id="before" name="direction" value="before">
            <label for="before">前</label>

            <input type="radio" id="after" name="direction" value="after">
            <label for="after">後</label>
        </div>

        <div class="field">
            <button type="button" id="calculateButton">計算する</button>
        </div>

        <p id="result"></p>
    </main>

    <script src="script.js"></script>

</body>
</html>
